<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fuel Route Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    #bar { padding: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #bar input { padding: 6px 8px; width: 220px; }
    #bar button { padding: 6px 14px; }
    #summary { padding: 0 10px 8px; font-size: 14px; color: #333; }
    #map { height: calc(100vh - 90px); }
  </style>
</head>
<body>
  <div id="bar">
    <strong>Fuel Route Planner</strong>
    <input id="start" placeholder="Start (e.g. New York, NY)" value="New York, NY">
    <input id="finish" placeholder="Finish (e.g. Los Angeles, CA)" value="Los Angeles, CA">
    <button onclick="plan()">Plan route</button>
  </div>
  <div id="summary"></div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([39.5, -98.35], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    let layer = null;

    async function plan() {
      const start = document.getElementById('start').value;
      const finish = document.getElementById('finish').value;
      document.getElementById('summary').textContent = 'Planning...';
      const resp = await fetch(`/api/route/?start=${encodeURIComponent(start)}&finish=${encodeURIComponent(finish)}`);
      const data = await resp.json();
      if (!resp.ok) { document.getElementById('summary').textContent = data.detail || 'Error'; return; }

      if (layer) map.removeLayer(layer);
      layer = L.layerGroup().addTo(map);
      const latlngs = data.route.geometry.coordinates.map(c => [c[1], c[0]]);
      L.polyline(latlngs, {weight: 4}).addTo(layer);
      L.marker(latlngs[0]).addTo(layer).bindPopup('Start: ' + data.start.display_name);
      L.marker(latlngs[latlngs.length - 1]).addTo(layer).bindPopup('Finish: ' + data.finish.display_name);
      for (const s of data.fuel_stops) {
        L.marker([s.lat, s.lon]).addTo(layer).bindPopup(
          `<b>${s.name}</b><br>${s.address}, ${s.city}, ${s.state}<br>` +
          `Mile ${s.mile_marker} - $${s.price_per_gallon}/gal x ${s.gallons_purchased} gal = $${s.cost}`
        );
      }
      map.fitBounds(L.latLngBounds(latlngs).pad(0.05));
      document.getElementById('summary').textContent =
        `${data.route.distance_miles} mi | ${data.fuel_stops.length} fuel stops | ` +
        `${data.total_gallons} gal | Total fuel cost: $${data.total_fuel_cost}` +
        (data.warnings.length ? ' | ' + data.warnings.join('; ') : '');
    }
  </script>
</body>
</html>
